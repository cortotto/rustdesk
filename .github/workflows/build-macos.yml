name: Build Branded macOS RustDesk Client

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build-macos:
    runs-on: macos-14 # Uses Apple Silicon (M-series) runner; change to macos-13 for Intel x86_64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          brew update
          brew install cmake ninja pkg-config nasm create-dmg cocoapods

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@1.75.0
        with:
          targets: aarch64-apple-darwin

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.0 --locked

      - name: Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Enable macOS Desktop Support
        run: flutter config --enable-macos-desktop

      - name: Setup vcpkg & C++ Libraries
        run: |
          # Temporarily move root vcpkg.json to prevent Manifest Mode activation
          if [ -f "vcpkg.json" ]; then mv vcpkg.json vcpkg.json.bak; fi
          
          rm -rf vcpkg
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh -disableMetrics
          ./vcpkg install libvpx libyuv opus aom
          echo "VCPKG_ROOT=$PWD" >> $GITHUB_ENV
          
          # Restore root vcpkg.json for subsequent Rust/Flutter build steps
          cd ..
          if [ -f "vcpkg.json.bak" ]; then mv vcpkg.json.bak vcpkg.json; fi

      - name: Inject Custom Server Config
        run: |
          SERVER="${{ secrets.RUSTDESK_SERVER }}"
          KEY="${{ secrets.RUSTDESK_KEY }}"
          
          # Inject host & key into the Rust source code
          CONFIG_FILE="src/common.rs"
          if [ -f "$CONFIG_FILE" ]; then
            sed -i '' "s/REND_SERVER: &str = \"\"/REND_SERVER: &str = \"$SERVER\"/g" $CONFIG_FILE
            sed -i '' "s/RS_PUB_KEY: &str = \"\"/RS_PUB_KEY: &str = \"$KEY\"/g" $CONFIG_FILE
          fi

      - name: Generate RustDesk Dart-Rust Bridge
        run: |
          # Generate generated_bridge.dart before running Flutter build steps
          flutter_rust_bridge_codegen --rust-input src/flutter_ffi.rs --dart-output flutter/lib/generated_bridge.dart || true
          
          # Alternatively, execute RustDesk's build bridge script if available in root
          if [ -f "build.rs" ]; then
            cargo check
          fi

      - name: Build Flutter App & macOS Bundle
        run: |
          cd flutter
          flutter pub get
          cd macos
          pod repo update
          pod install
          cd ..
          flutter build macos --release --build-name=1.0.0 --build-number=1

      - name: Package into DMG
        run: |
          mkdir -p output
          APP_PATH="flutter/build/macos/Build/Products/Release/RustDesk.app"
          
          # Create DMG installer
          create-dmg \
            --volname "RustDesk Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "output/Branded-RustDesk-macOS.dmg" \
            "$APP_PATH"

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v5
        with:
          name: macOS-Branded-RustDesk-DMG
          path: output/Branded-RustDesk-macOS.dmg
